[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "vvla-oft"
version = "0.1.0b2"
description = "Isolated OpenVLA-OFT backend for VVLA"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["vvla==0.1.0b2", "vvla-runtime==0.1.0b2", "torch==2.13.0", "torchvision==0.28.0", "numpy==1.26.4", "tokenizers==0.19.1", "timm==0.9.10", "diffusers==0.30.3", "accelerate==0.34.2", "tensorflow-cpu==2.18.1", "sentencepiece==0.2.0", "setuptools==80.10.2"]
# The upstream bidirectional Transformers fork must be installed by the OFT
# environment lock. PyPI transformers==4.40.1 alone does not satisfy that contract.
[tool.setuptools.packages.find]
where = ["src"]

