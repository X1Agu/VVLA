[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "vvla-runtime"
version = "0.1.0b2"
description = "Shared CUDA execution and resource ownership for VVLA backends"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["torch==2.13.0", "numpy>=1.26,<3", "ninja>=1.11"]
[project.optional-dependencies]
native = ["vllm==0.32.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
vvla_runtime = ["**/*.cpp", "**/*.json"]

