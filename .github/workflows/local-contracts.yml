name: contracts-and-distribution
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu-and-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/pi05/environments/linux-py312-cu130.lock
      - run: python -m pip install ".[test]"
      - run: python tools/run_cpu_checks.py
      - run: python tools/check_release.py --ml-python "$(command -v python)" --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-and-package-evidence
          path: |
            artifacts/cpu-contracts.xml
            artifacts/release-check-*/build-records.json
            artifacts/release-check-*/installed-check.json
            artifacts/release-check-*/worker-protocol.json
            artifacts/release-check-*/*.log
            artifacts/release-check-*/*/*.log
