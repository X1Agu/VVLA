name: explicitly-requested-local-gpu
on: workflow_dispatch
jobs:
  mechanism:
    runs-on: [self-hosted, linux, x64, vvla-local-gpu]
    steps:
      - uses: actions/checkout@v4
      # Runner administrator supplies the isolated tested environment.
      - run: "$VVLA_ML_PYTHON tools/run_gpu_checks.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-gpu-mechanism-evidence
          path: |
            artifacts/local-gpu.xml
            artifacts/local-gpu.json
            artifacts/tiny-*.json
            artifacts/graph-memory-cuda.json
