[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vvla"
version = "0.1.0b2"
description = "Isolated VLA inference backends with one owned-action SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
serve = ["aiohttp>=3.12,<4"]
hub = ["huggingface-hub>=0.25,<2"]
omni = ["vllm==0.32.0", "vllm-omni==0.32.0.dev0+g98c204144", "PyYAML>=6,<7", "msgpack-numpy==0.4.8", "aiohttp>=3.12,<4"]
test = ["aiohttp>=3.12,<4", "pytest>=9,<10", "build>=1.3,<2", "wheel>=0.45"]

[project.scripts]
vvla = "vvla.cli:main"

[project.entry-points."vllm_omni.general_plugins"]
vvla_omni = "vvla.integrations.omni.plugin:register"

[project.entry-points."vllm.general_plugins"]
vvla_omni = "vvla.integrations.omni.plugin:register"

[tool.setuptools.package-data]
vvla = ["data/*.json", "integrations/omni/controller/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/contracts", "tests/packaging"]
markers = ["gpu: requires a local CUDA device", "native: compiles a C++ extension"]
addopts = "--strict-markers"

